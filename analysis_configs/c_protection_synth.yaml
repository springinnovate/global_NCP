# Coastal protection extraction using the rasterized inputs.
# Uses canonical land grid and GLOBAL_NCP_DATA for portability.

workspace_dir:
  path: "./summary_pipeline_workspace_ha"

vector_zones:
  grid_10km_land:
    path: "${GLOBAL_NCP_DATA}/vector_basedata/landgrid_1_clean_enriched_4326.gpkg"

raster_layers:
  # NOTE: rasterize_coastal.py outputs to interim/coastal_protection_rasters/
  # C_Risk_1992/2020 and C_Risk_Red_Ratio_1992/2020 (Rt_*.tif, Rt_ratio_*.tif) are DELIBERATELY
  # OMITTED from this run (2026-08-28) -- confirmed via a real dry run that those raster files no
  # longer exist in this local checkout (moved to interim/archive/ on the server during an earlier
  # reprocessing step, never copied back). Re-running this config previously failed with
  # "Rt_2020.tif: No such file or directory" for exactly this reason. Their extracted VALUES
  # already exist correctly in the current 10k_change_calc.gpkg from a prior (server-side) run
  # (c_risk_abs_chg/pct_chg, c_risk_red_ratio_abs_chg/pct_chg), so there is no need to re-derive
  # them here -- this run is scoped to only the new column below. If the Rt_*.tif/Rt_ratio_*.tif
  # rasters are ever recovered/regenerated, they can be added back for a from-scratch re-extraction.
  #
  # Added 2026-08-28: coastal protection amount (Rt_nohab_all - Rt), replacing C_Risk for the
  # 5-service retention/protection redesign. See docs/manuscript/becky_steve_feedback_plan.md
  # and the paper's Hotspot Identification section for why.
  C_Prot_service_1992:
    path: "${GLOBAL_NCP_DATA}/interim/coastal_protection_rasters/Rt_service_1992.tif"
    band: 1
  C_Prot_service_2020:
    path: "${GLOBAL_NCP_DATA}/interim/coastal_protection_rasters/Rt_service_2020.tif"
    band: 1

op_stats:
  - mean