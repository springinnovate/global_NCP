project:
  type: book

book:
  title: "Ecosystem Service Hotspots: A Global Assessment of Change, Exposure, and Attribution, 1992–2020"
  subtitle: "Where nature is changing, who is exposed, and the limits of land cover as a monitoring proxy"
  author: "Jerónimo Rodríguez Escobar, Becky Chaplin-Kramer, Richard P. Sharp, Stephen Polasky, [Additional Authors TBD]"
  date: last-modified

  chapters:
    # Main narrative chapters (policy-focused)
    - index.qmd
    - part: "Part 1: Understanding the Challenge"
    - chapters/01-problem.qmd
    - chapters/02-methods.qmd
    - part: "Part 2: Global State (WHAT)"
    - chapters/03-global-patterns-WHAT.qmd
    - part: "Part 3: Geographic Analysis (WHERE)"
    - chapters/04-hotspot-WHERE.qmd
    - part: "Part 4: Understanding Drivers (WHY)"
    - chapters/05-drivers-WHY.qmd
    - part: "Part 5: Socioeconomic Analysis (WHO)"
    - chapters/06-hotspot-WHO.qmd
    - chapters/07-regional-profiles.qmd
    - part: "Part 6: Implications & Action"
    - chapters/08-conclusions.qmd
    # Technical appendix (reference only, not main narrative)
    - part: "Technical Documentation"
    - chapters/09-annex-methodology.qmd

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    number-sections: true
    css: chapters/_custom.css
    include-in-header: chapters/_header.html
    embed-resources: true

execute:
  echo: false
  warning: false
  message: false
  cache: true
