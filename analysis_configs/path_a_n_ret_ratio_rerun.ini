; Path A rerun for the nitrogen retention ratio only (2026-10-01).
; Why: Python_scripts/calculate_ratios.py paired N retention and N export by pixel index although
; their grids are offset by 36 columns, and Path A's ratio used an older N export version.
; Rasters from Python_scripts/rerun_n_ret_ratio_path_a.py: ratio 1992, ratio 2020, change.
; Same jobs/operations as zonal_stats_toolkit/global_ncp_diff_consolidated.ini, absolute paths
; inside the Docker container (C:/projects -> /projects, ~/data/global_ncp -> /gncp).

[project]
name = path_a_n_ret_ratio_rerun
global_work_dir = /projects/global_NCP/data/raw/n_ret_ratio_aligned/workdir
global_output_dir = /projects/global_NCP/data/raw/n_ret_ratio_aligned/output
log_level = INFO

[job:country]
agg_vector = /gncp/vector_basedata/cartographic_ee_r264_correspondence.gpkg
agg_field = nev_name
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/n_ret_ratio_aligned/*.tif

[job:region_wb]
agg_vector = /gncp/vector_basedata/cartographic_ee_r264_correspondence.gpkg
agg_field = region_wb
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/n_ret_ratio_aligned/*.tif

[job:income_grp]
agg_vector = /gncp/vector_basedata/cartographic_ee_r264_correspondence.gpkg
agg_field = income_grp
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/n_ret_ratio_aligned/*.tif

[job:biome]
agg_vector = /gncp/vector_basedata/Biome.gpkg
agg_field = WWF_biome
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/n_ret_ratio_aligned/*.tif
