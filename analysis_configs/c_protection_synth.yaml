# Coastal protection extraction using the rasterized inputs.
# Uses canonical land grid and GLOBAL_NCP_DATA for portability.

workspace_dir:
  path: "./summary_pipeline_workspace_ha"

vector_zones:
  grid_10km_land:
    path: "${GLOBAL_NCP_DATA}/vector_basedata/landgrid_1_clean_enriched_4326.gpkg"

raster_layers:
  C_Risk_1992:
    path: "${GLOBAL_NCP_DATA}/interim/coastal_protection_rasters/Rt_1992.tif"
    band: 1
  C_Risk_2020:
    path: "${GLOBAL_NCP_DATA}/interim/coastal_protection_rasters/Rt_2020.tif"
    band: 1
  C_Risk_Red_Ratio_1992:
    path: "${GLOBAL_NCP_DATA}/interim/coastal_protection_rasters/Rt_ratio_1992.tif"
    band: 1
  C_Risk_Red_Ratio_2020:
    path: "${GLOBAL_NCP_DATA}/interim/coastal_protection_rasters/Rt_ratio_2020.tif"
    band: 1

op_stats:
  - mean