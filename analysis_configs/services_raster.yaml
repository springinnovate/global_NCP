# Zonal statistics extraction using a zone RASTER instead of a vector.
# This is the new, robust workflow that bypasses vector geometry issues.

workspace_dir:
  path: "./data/interim_raster"

# This is the critical input: a raster where each pixel's value is the 'fid'
# of the 10km grid cell it belongs to.
zone_raster:
  path: "${GLOBAL_NCP_DATA}/processed/10km_zone_raster_fids.tif"

raster_layers:
  global_usle_marine_mod_ESA_1992:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/global_usle_marine_mod_ESA_1992_compressed_md5_7e68e0.tif"
    band: 1
  global_usle_marine_mod_ESA_2020:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/global_usle_marine_mod_ESA_2020_compressed_md5_99e715.tif"
    band: 1
  nature_access_lspop2019_ESA1992:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/nature_access_lspop2019_ESA1992_md5_b32b8b.tif"
    band: 1
  nature_access_lspop2019_ESA2020:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/nature_access_lspop2019_ESA2020_compressed_md5_6727ac.tif"
    band: 1
  N_ret_ratio_1992:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/n_retention_ratio_1992.tif"
    band: 1
  N_ret_ratio_2020:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/n_retention_ratio_2020.tif"
    band: 1
  Sed_ret_ratio_1992:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/sed_retention_ratio_1992.tif"
    band: 1
  Sed_ret_ratio_2020:
    path: "${GLOBAL_NCP_DATA}/raw/base_years_ha/sed_retention_ratio_2020.tif"
    band: 1
  global_n_export_tnc_esa1992:
