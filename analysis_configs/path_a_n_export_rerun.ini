; Path A rerun for nitrogen export only (2026-10-01).
; Why: Path A's per-ha change rasters (March 2026) used an OLDER N-export version than Path B and
; the base-year run; sediment, pollination and N retention were verified identical and are NOT rerun.
; Same jobs/operations as zonal_stats_toolkit/global_ncp_diff_consolidated.ini, absolute paths
; inside the Docker container (C:/projects -> /projects, ~/data/global_ncp -> /gncp).
; Run via Python_scripts/rerun_n_export_path_a.py.

[project]
name = path_a_n_export_rerun
global_work_dir = /projects/global_NCP/data/raw/path_a_rerun/workdir
global_output_dir = /projects/global_NCP/data/raw/path_a_rerun/output
log_level = INFO

[job:country]
agg_vector = /gncp/vector_basedata/cartographic_ee_r264_correspondence.gpkg
agg_field = nev_name
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/2020_1992_ch_ha/n_export_diff_1992_2020.tif

[job:region_wb]
agg_vector = /gncp/vector_basedata/cartographic_ee_r264_correspondence.gpkg
agg_field = region_wb
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/2020_1992_ch_ha/n_export_diff_1992_2020.tif

[job:income_grp]
agg_vector = /gncp/vector_basedata/cartographic_ee_r264_correspondence.gpkg
agg_field = income_grp
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/2020_1992_ch_ha/n_export_diff_1992_2020.tif

[job:biome]
agg_vector = /gncp/vector_basedata/Biome.gpkg
agg_field = WWF_biome
operations = mean,stdev,valid_count,total_count
row_col_order = agg_field,base_raster
base_raster_pattern = /projects/global_NCP/data/raw/2020_1992_ch_ha/n_export_diff_1992_2020.tif
